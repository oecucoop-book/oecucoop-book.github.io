<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>取寄せ本 状況確認 | 大阪電気通信大生協</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    :root {
      --md-sys-color-primary: #00639b;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #d1e4ff;
      --md-sys-color-on-primary-container: #001d33;
      --md-sys-color-surface: #f8f9ff;
      --md-sys-color-surface-container-lowest: #ffffff;
      --md-sys-color-surface-container: #edf1fa;
      --md-sys-color-surface-container-high: #e7ebf4;
      --md-sys-color-on-surface: #191c20;
      --md-sys-color-on-surface-variant: #424750;
      --md-sys-color-outline: #727782;
      --md-sys-color-outline-variant: #c2c7d2;
      --md-sys-color-error: #ba1a1a;
      --md-sys-color-error-container: #ffdad6;
      --md-sys-color-on-error-container: #410002;
      --md-sys-color-tertiary-container: #ffdcc2;
      --md-sys-color-on-tertiary-container: #2e1500;
      --md-sys-color-success-container: #c4eed0;
      --md-sys-color-on-success-container: #00210b;
      --md-shape-corner-small: 8px;
      --md-shape-corner-medium: 12px;
      --md-shape-corner-large: 16px;
      --md-shape-corner-full: 9999px;
      --md-elevation-1: 0 1px 3px 1px rgba(0, 0, 0, 0.15), 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --md-elevation-2: 0 2px 6px 2px rgba(0, 0, 0, 0.15), 0 1px 2px 0 rgba(0, 0, 0, 0.3);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', 'Noto Sans JP', sans-serif;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .top-app-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 16px;
      background-color: var(--md-sys-color-surface);
    }

    .top-app-bar .headline {
      font-size: 22px;
      font-weight: 700;
      color: var(--md-sys-color-primary);
      margin: 0 0 4px;
      letter-spacing: -0.2px;
    }

    .top-app-bar .subtitle {
      font-size: 13px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
    }

    .main-wrapper {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .md-card {
      background-color: var(--md-sys-color-surface-container-lowest);
      border-radius: var(--md-shape-corner-large);
      border: 1px solid var(--md-sys-color-outline-variant);
      padding: 20px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .summary-card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      background-color: var(--md-sys-color-surface-container);
      border: none;
      padding: 16px;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .summary-item .material-symbols-rounded {
      font-size: 20px;
      color: var(--md-sys-color-primary);
      margin-bottom: 4px;
    }

    .summary-item .label {
      font-size: 11px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
    }

    .summary-item .value {
      font-size: 14px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
      margin-top: 2px;
    }

    .book-item-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .book-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .book-title-group {
      flex: 1;
    }

    .chip-receipt {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface-variant);
      background-color: var(--md-sys-color-surface-container-high);
      padding: 2px 8px;
      border-radius: var(--md-shape-corner-small);
      margin-bottom: 6px;
    }

    .book-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
      margin: 0 0 4px;
      line-height: 1.4;
    }

    .book-publisher {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      margin: 0;
    }

    .md-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: var(--md-shape-corner-small);
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .md-chip.registered {
      background-color: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
    }

    .md-chip.ordered {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .md-chip.arrived {
      background-color: var(--md-sys-color-success-container);
      color: var(--md-sys-color-on-success-container);
    }

    .md-chip.expired {
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }

    .stepper-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      margin: 8px 4px;
    }

    .stepper-line {
      position: absolute;
      top: 14px;
      left: 10%;
      right: 10%;
      height: 2px;
      background-color: var(--md-sys-color-outline-variant);
      z-index: 1;
    }

    .step-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      position: relative;
      z-index: 2;
      width: 68px;
    }

    .step-circle {
      width: 28px;
      height: 28px;
      border-radius: var(--md-shape-corner-full);
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-outline);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .step-circle .material-symbols-rounded {
      font-size: 16px;
    }

    .step-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--md-sys-color-outline);
      text-align: center;
      line-height: 1.2;
    }

    .step-item.active .step-circle {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }

    .step-item.active .step-label {
      color: var(--md-sys-color-primary);
      font-weight: 700;
    }

    .step-item.completed .step-circle {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
    }

    .step-item.completed .step-label {
      color: var(--md-sys-color-on-surface);
    }

    .status-container {
      background-color: var(--md-sys-color-surface-container);
      border-radius: var(--md-shape-corner-medium);
      padding: 12px 14px;
      font-size: 13px;
      color: var(--md-sys-color-on-surface);
      line-height: 1.5;
    }

    .book-note-card {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
      border-radius: var(--md-shape-corner-medium);
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 500;
    }

    .book-note-card .material-symbols-rounded {
      font-size: 18px;
      flex-shrink: 0;
    }

    .notify-card {
      background-color: var(--md-sys-color-surface-container-high);
      border: none;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .notify-card h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .notify-card p {
      margin: 0 0 6px;
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .md-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 40px;
      padding: 0 24px;
      border-radius: var(--md-shape-corner-full);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      box-shadow: var(--md-elevation-1);
      transition: background-color 0.2s, box-shadow 0.2s, transform 0.1s;
    }

    .md-btn-primary {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }

    .md-btn-primary:hover {
      box-shadow: var(--md-elevation-2);
      filter: brightness(1.08);
    }

    .md-btn-primary:active {
      transform: scale(0.98);
    }

    .md-btn.registered {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
      box-shadow: none;
      cursor: default;
    }

    .guide-card {
      background-color: transparent;
      border: 1px dashed var(--md-sys-color-outline-variant);
    }

    .guide-card h3 {
      font-size: 13px;
      font-weight: 700;
      margin: 0 0 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--md-sys-color-on-surface);
    }

    .guide-card p {
      font-size: 12px;
      margin: 0;
      color: var(--md-sys-color-on-surface-variant);
      line-height: 1.6;
    }

    .footer-org {
      text-align: center;
      font-size: 12px;
      color: var(--md-sys-color-outline);
      margin-top: 12px;
    }

    .loading-screen {
      position: fixed;
      inset: 0;
      background-color: var(--md-sys-color-surface);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 16px;
      z-index: 1000;
    }

    .md-circular-progress {
      width: 48px;
      height: 48px;
      border: 4px solid var(--md-sys-color-surface-container-high);
      border-top-color: var(--md-sys-color-primary);
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeout {
      0% { opacity: 1; }
      100% { opacity: 0; pointer-events: none; }
    }
  </style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="md-circular-progress"></div>
  <div style="font-size: 15px; font-weight: 500; color: var(--md-sys-color-primary);">状況を確認しています</div>
  <div id="loadingReceipt" style="font-size: 12px; color: var(--md-sys-color-outline);"></div>
</div>

<header class="top-app-bar">
  <h1 class="headline">取寄せ本 状況確認</h1>
  <div class="subtitle">大阪電気通信大学生活協同組合</div>
</header>

<main class="main-wrapper">
  <div class="md-card summary-card" id="summaryCard" style="display: none;">
    <div class="summary-item">
      <span class="material-symbols-rounded">tag</span>
      <span class="label">代表受付番号</span>
      <span class="value" id="dispMainReceiptNo">-</span>
    </div>
    <div class="summary-item">
      <span class="material-symbols-rounded">calendar_today</span>
      <span class="label">受付日時</span>
      <span class="value" id="dispReceivedAt" style="font-size: 12px;">-</span>
    </div>
    <div class="summary-item">
      <span class="material-symbols-rounded">auto_stories</span>
      <span class="label">冊数</span>
      <span class="value" id="dispItemCount">-</span>
    </div>
  </div>

  <div class="md-card notify-card" id="notificationCard" style="display: none;">
    <h3><span class="material-symbols-rounded">notifications</span>入荷をプッシュ通知で受け取る</h3>
    <p id="notifyDesc">取寄せ中の本が入荷した際、この端末に通知でお知らせします。</p>
    <button id="btnSubscribePush" class="md-btn md-btn-primary">
      <span class="material-symbols-rounded">notifications_active</span>通知を受け取る
    </button>
  </div>

  <div id="booksListArea" style="display: flex; flex-direction: column; gap: 16px;"></div>

  <div class="md-card guide-card">
    <h3><span class="material-symbols-rounded">info</span>受取時のご案内</h3>
    <p>
      ・「入荷済み」になりましたら、生協店舗レジにて受付番号をお伝えいただくか、本画面をご提示の上お受け取りください。<br>
      ・複数冊ご注文の場合、入荷日が異なる場合がございます。<br>
      ・最新の状況を確認するにはページを再読み込みしてください。
    </p>
  </div>

  <div class="footer-org">
    大阪電気通信大学生活協同組合
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-messaging.js";

  const firebaseConfig = {
      apiKey: "AIzaSyDl7dK6vJFCSe4eevk-iHsBSVzl0NHWh44",
      authDomain: "oecu-coop-book-notify.firebaseapp.com",
      projectId: "oecu-coop-book-notify",
      storageBucket: "oecu-coop-book-notify.firebasestorage.app",
      messagingSenderId: "268169649991",
      appId: "1:268169649991:web:5c4aa64bb2c5abbbc9f662"
  };

  const vapidKey = "BLRtU5PYWtGI-Cb9yhk1ThRewUEpQqnMA6xcWskh89zdJr79ZRb32YpvHxrKDIE4O92-Vf31CBkzdG7xQNsBmdE";
  const API_ENDPOINT = "https://api.oecucoop-book-info.workers.dev/";

  const app = initializeApp(firebaseConfig);
  const messaging = getMessaging(app);

  let currentTargetId = "";

  window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    currentTargetId = urlParams.get('id') || urlParams.get('hash');

    if (!currentTargetId) {
      showError("URLに ID パラメータが指定されていません。");
      return;
    }

    document.getElementById("loadingReceipt").textContent = "ID: " + currentTargetId;
    fetchBookData(currentTargetId);
    setupNotificationButton();
  });

  function fetchBookData(id) {
    const requestUrl = `${API_ENDPOINT}?id=${encodeURIComponent(id)}`;

    fetch(requestUrl, {
      method: "GET",
      referrerPolicy: "no-referrer"
    })
      .then(response => {
        return response.json();
      })
      .then(data => {
        renderData(data);
      })
      .catch(error => {
        console.error("Fetch error:", error);
        showError("データ取得に失敗しました。<br>通信状況を確認するか、しばらく経ってから再度お試しください。");
      });
  }

  function renderData(response) {
    if (!response || response.code !== 200 || !response.data || response.data.length === 0) {
      showError("該当する取寄せ情報が見つかりませんでした。");
      return;
    }

    const orderData = response.data[0];
    const items = orderData.items || [];

    document.getElementById("dispMainReceiptNo").textContent = orderData.mainReceiptNumber ? `#${orderData.mainReceiptNumber}` : "-";
    document.getElementById("dispItemCount").textContent = `${items.length} 冊`;

    if (orderData.receivedAt) {
      const d = new Date(orderData.receivedAt);
      const formatted = `${d.getFullYear()}/${('0'+(d.getMonth()+1)).slice(-2)}/${('0'+d.getDate()).slice(-2)} ${('0'+d.getHours()).slice(-2)}:${('0'+d.getMinutes()).slice(-2)}`;
      document.getElementById("dispReceivedAt").textContent = formatted;
    } else {
      document.getElementById("dispReceivedAt").textContent = "-";
    }

    document.getElementById("summaryCard").style.display = "grid";

    const listArea = document.getElementById("booksListArea");
    listArea.innerHTML = "";

    let hasPendingItem = false;

    items.forEach((item) => {
      if (item.status === "情報登録待ち" || item.status === "入荷前") {
        hasPendingItem = true;
      }
      const card = createBookCardElement(item);
      listArea.appendChild(card);
    });

    const notifyCard = document.getElementById("notificationCard");
    notifyCard.style.display = hasPendingItem ? "flex" : "none";

    hideLoading();
  }

  function createBookCardElement(item) {
    const card = document.createElement("div");
    card.className = "md-card book-item-card";

    let chipClass = "registered";
    let step1Class = "step-item";
    let step2Class = "step-item";
    let step3Class = "step-item";
    let statusDesc = "";
    let step1Icon = "1";
    let step2Icon = "2";
    let step3Icon = "3";

    switch (item.status) {
      case "情報登録待ち":
        chipClass = "registered";
        step1Class += " active";
        statusDesc = "<strong>【注文確認中】</strong> ご注文を受付いたしました。生協側での発注手配までお待ちください。";
        break;
      case "入荷前":
        chipClass = "ordered";
        step1Class += " completed";
        step2Class += " active";
        step1Icon = '<span class="material-symbols-rounded">check</span>';
        statusDesc = "<strong>【取寄せ手配中】</strong> 出版社・取次店へ発注中です。店舗へ届くまでお待ちください。";
        break;
      case "入荷済み":
        chipClass = "arrived";
        step1Class += " completed";
        step2Class += " completed";
        step3Class += " active";
        step1Icon = '<span class="material-symbols-rounded">check</span>';
        step2Icon = '<span class="material-symbols-rounded">check</span>';
        statusDesc = "<strong style='color:#007f3b;'>【店舗に入荷済み】</strong> 店舗レジにて受付番号または本画面をご提示の上、お受け取りください。";
        break;
      case "期限切れ":
        chipClass = "expired";
        statusDesc = "<strong style='color:var(--md-sys-color-error);'>【保管期限切れ】</strong> お取り置き期限が過ぎております。生協窓口までお問い合わせください。";
        break;
      default:
        chipClass = "registered";
        statusDesc = `<strong>【ステータス: ${escapeHtml(item.status || '確認中')}】</strong> 生協窓口までお問い合わせください。`;
        break;
    }

    const noteHtml = item.note && item.note.trim() !== ""
      ? `<div class="book-note-card"><span class="material-symbols-rounded">priority_high</span><div>${escapeHtml(item.note)}</div></div>`
      : "";

    card.innerHTML = `
      <div class="book-card-header">
        <div class="book-title-group">
          <div class="chip-receipt">番号: ${escapeHtml(item.receiptNumber || '-')}</div>
          <h2 class="book-title">${escapeHtml(item.textbookName || '（書籍名未登録）')}</h2>
          <p class="book-publisher">${escapeHtml(item.publisher || '-')}</p>
        </div>
        <span class="md-chip ${chipClass}">${escapeHtml(item.status || '確認中')}</span>
      </div>

      <div class="stepper-container">
        <div class="stepper-line"></div>
        <div class="${step1Class}">
          <div class="step-circle">${step1Icon}</div>
          <div class="step-label">情報登録</div>
        </div>
        <div class="${step2Class}">
          <div class="step-circle">${step2Icon}</div>
          <div class="step-label">取寄せ中</div>
        </div>
        <div class="${step3Class}">
          <div class="step-circle">${step3Icon}</div>
          <div class="step-label">入荷済み</div>
        </div>
      </div>

      <div class="status-container">${statusDesc}</div>
      ${noteHtml}
    `;

    return card;
  }

  function setupNotificationButton() {
    const btn = document.getElementById('btnSubscribePush');
    const desc = document.getElementById('notifyDesc');

    const isSubscribed = localStorage.getItem('push_subscribed_' + currentTargetId);
    if (isSubscribed) {
      setButtonAsRegistered(btn, desc);
    }

    btn.addEventListener('click', async () => {
      if (btn.classList.contains('registered')) return;

      try {
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-rounded">sync</span>登録中...';

        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          alert('通知が許可されませんでした。ブラウザの設定をご確認ください。');
          btn.disabled = false;
          btn.innerHTML = '<span class="material-symbols-rounded">notifications_active</span>通知を受け取る';
          return;
        }

        const registration = await navigator.serviceWorker.register('./firebase-messaging-sw.js');
        const token = await getToken(messaging, {
          vapidKey: vapidKey,
          serviceWorkerRegistration: registration
        });

        if (!token) throw new Error("トークンの取得に失敗しました。");

        const res = await fetch(API_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            internalId: currentTargetId,
            fcmToken: token
          })
        });

        const result = await res.json();
        if (result.status === 'success') {
          localStorage.setItem('push_subscribed_' + currentTargetId, 'true');
          setButtonAsRegistered(btn, desc);
          alert('入荷通知の登録が完了しました！\n本が入荷しましたら通知でお知らせします。');
        } else {
          throw new Error(result.message || "通知の登録に失敗しました。");
        }

      } catch (err) {
        console.error("通知登録エラー:", err);
        alert('登録中にエラーが発生しました: ' + err.message);
        btn.disabled = false;
        btn.innerHTML = '<span class="material-symbols-rounded">notifications_active</span>通知を受け取る';
      }
    });
  }

  function setButtonAsRegistered(btn, desc) {
    btn.innerHTML = '<span class="material-symbols-rounded">check</span>通知登録済み';
    btn.classList.add('registered');
    btn.disabled = true;
    desc.textContent = "この端末に入荷通知が届くよう設定されています。";
  }

  onMessage(messaging, (payload) => {
    alert(`【${payload.notification.title}】\n${payload.notification.body}`);
  });

  function showError(message) {
    hideLoading();
    const listArea = document.getElementById("booksListArea");
    listArea.innerHTML = `
      <div class="md-card" style="border-color: var(--md-sys-color-error); text-align: center; color: var(--md-sys-color-error); font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <span class="material-symbols-rounded" style="font-size: 32px;">error</span>
        <div>${message}</div>
      </div>
    `;
  }

  function hideLoading() {
    const loading = document.getElementById('loadingScreen');
    if (!loading) return;
    loading.style.animation = 'fadeout 0.3s forwards';
    setTimeout(() => {
      loading.style.display = 'none';
    }, 300);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }
</script>
</body>
</html>
